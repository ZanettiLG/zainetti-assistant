<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Assistente Zainetti</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="chat-app">
    <!-- Header -->
    <header class="chat-header">
      <div class="chat-header__content">
        <div class="chat-header__avatar">
          <img src="./assets/zanaitti.png" alt="Zainetti" />
        </div>
        <div class="chat-header__info">
          <h1 class="chat-header__name">Assistente Zainetti</h1>
          <span class="chat-header__status">
            <span class="status-dot"></span>
            Online
          </span>
        </div>
      </div>
    </header>

    <!-- Messages Area -->
    <main class="chat-messages" id="chat-messages">
      <div class="messages-container" id="messages-container">
        <!-- Welcome message -->
        <div class="message message--bot" id="welcome-message">
          <div class="message__avatar">
            <img src="./assets/zanaitti.png" alt="Zainetti" />
          </div>
          <div class="message__content">
            <div class="message__bubble">
              <p>Olá! Eu sou o <strong>Assistente Zainetti</strong>, treinado com todas as aulas do Professor Zanetti. Pergunte sobre as aulas que eu te ajudo! 🎓</p>
            </div>
            <span class="message__time">Agora</span>
          </div>
        </div>
      </div>
    </main>

    <!-- Input Area -->
    <footer class="chat-input-area">
      <form class="chat-form" id="chat-form">
        <div class="chat-input-wrapper">
          <textarea
            id="message-input"
            class="chat-input"
            placeholder="Digite sua pergunta..."
            rows="1"
            dir="auto"
          ></textarea>
          <button type="submit" class="chat-send-btn" aria-label="Enviar">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </form>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
